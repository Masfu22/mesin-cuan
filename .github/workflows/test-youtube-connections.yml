name: Test YouTube channel connections

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel yang akan diperiksa
        required: true
        type: choice
        default: all
        options:
          - all
          - ch_id_horror
          - ch_id_psych
          - ch_en_horror
          - ch_en_psych

permissions:
  contents: read

jobs:
  test-youtube-oauth:
    name: Verify YouTube OAuth without uploading
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google API libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Test OAuth and identify channel
        env:
          CHANNEL: ${{ inputs.channel }}
          TOKEN_CH_ID_HORROR: ${{ secrets.TOKEN_CH_ID_HORROR }}
          TOKEN_CH_ID_PSYCH: ${{ secrets.TOKEN_CH_ID_PSYCH }}
          TOKEN_CH_EN_HORROR: ${{ secrets.TOKEN_CH_EN_HORROR }}
          TOKEN_CH_EN_PSYCH: ${{ secrets.TOKEN_CH_EN_PSYCH }}
        run: |
          python - <<'PY'
          import json
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          token_map = {
              "ch_id_horror": "TOKEN_CH_ID_HORROR",
              "ch_id_psych": "TOKEN_CH_ID_PSYCH",
              "ch_en_horror": "TOKEN_CH_EN_HORROR",
              "ch_en_psych": "TOKEN_CH_EN_PSYCH",
          }
          selected = os.environ.get("CHANNEL", "all")
          channels = list(token_map) if selected == "all" else [selected]
          failures = 0

          for channel in channels:
              print("\\n" + "=" * 58)
              print("Memeriksa:", channel)
              raw = os.environ.get(token_map[channel], "").strip()
              if not raw:
                  print("GAGAL: GitHub Secret token belum diisi.")
                  failures += 1
                  continue
              try:
                  info = json.loads(raw)
                  creds = Credentials.from_authorized_user_info(info)
                  if not creds.refresh_token:
                      raise RuntimeError("Token tidak memiliki refresh_token.")
                  if creds.expired or not creds.valid:
                      creds.refresh(Request())
                  yt = build("youtube", "v3", credentials=creds, cache_discovery=False)
                  result = yt.channels().list(part="id,snippet", mine=True, maxResults=5).execute()
                  items = result.get("items", [])
                  if not items:
                      raise RuntimeError("OAuth valid, tetapi Google tidak mengembalikan channel milik akun ini.")
                  for item in items:
                      print("BERHASIL: OAuth terhubung")
                      print("Nama channel:", item.get("snippet", {}).get("title", "(tanpa nama)"))
                      print("Channel ID:", item.get("id", "(tidak tersedia)"))
                  print("Catatan: tidak ada video yang diunggah atau diubah.")
              except Exception as exc:
                  message = str(exc).replace(raw, "[TOKEN DISEMBUNYIKAN]")
                  print("GAGAL:", message[:1200])
                  failures += 1

          print("\\nHasil:", len(channels) - failures, "berhasil;", failures, "gagal.")
          if failures:
              raise SystemExit(1)
          PY
