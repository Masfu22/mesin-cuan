name: Mesin Cuan - GitHub Actions

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "engine/**"
      - "requirements.txt"
      - "config/*.json"
      - ".github/workflows/mesin-cuan.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Pilih pengujian atau produksi"
        required: true
        type: choice
        options:
          - preview
          - provider-test
          - script-test
          - dry-run
          - production
        default: preview
      channel:
        description: "Channel yang dijalankan"
        required: true
        type: choice
        options:
          - ch_id_horror
          - ch_id_psych
          - ch_en_horror
          - ch_en_psych
        default: ch_id_horror
      topic:
        description: "Topik manual (dipakai script-test, dry-run, dan production)"
        required: false
        type: string
        default: "Tes integrasi provider AI Mesin Cuan"
      profile:
        description: "Format konten"
        required: true
        type: choice
        options:
          - shorts
          - long_form
        default: shorts
      skip_qc:
        description: "Lewati QC Vision (tidak disarankan)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mesin-cuan-${{ inputs.mode == 'production' && 'production' || inputs.mode == 'dry-run' && 'dry-run' || 'test' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Static validation (no API calls or production)
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate workflow YAML, JSON config, and Python syntax
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import json, pathlib, yaml
          workflow_path = pathlib.Path(".github/workflows/mesin-cuan.yml")
          document = yaml.load(workflow_path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
          if "workflow_dispatch" not in document.get("on", {}):
              raise SystemExit("workflow_dispatch trigger missing")
          if "push" not in document.get("on", {}):
              raise SystemExit("safe push validation trigger missing")
          for path in ("config/settings.json", "config/campaigns.json"):
              json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          print("PASS: GitHub Actions YAML and both JSON configuration files.")
          PY
          python -m compileall -q main.py engine
          grep -q '^openai>=' requirements.txt
          echo "PASS: Python syntax and NVIDIA OpenAI SDK dependency."

  run:
    if: github.event_name == 'workflow_dispatch'
    name: Mesin Cuan / ${{ inputs.mode }} / ${{ inputs.channel }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TTS_MODE: edge
      RENDER_PRESET: fast
      LOG_LEVEL: INFO
      # NVIDIA: utama untuk pembuatan naskah dan analisis vision.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
      NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
      # Gemini: fallback berotasi (satu sampai sepuluh key).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
      GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
      GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
      GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      # Provider tambahan.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
      PROVIDER_A_API_KEY: ${{ secrets.PROVIDER_A_API_KEY }}
      PROVIDER_A_BASE_URL: ${{ secrets.PROVIDER_A_BASE_URL }}
      PROVIDER_A_MODEL: ${{ secrets.PROVIDER_A_MODEL }}
      # Media, research, voice, and notifications.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVERR_APP_ID: ${{ secrets.COVERR_APP_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      TOKEN_CH_ID_HORROR: ${{ secrets.TOKEN_CH_ID_HORROR }}
      TOKEN_CH_ID_PSYCH: ${{ secrets.TOKEN_CH_ID_PSYCH }}
      TOKEN_CH_EN_HORROR: ${{ secrets.TOKEN_CH_EN_HORROR }}
      TOKEN_CH_EN_PSYCH: ${{ secrets.TOKEN_CH_EN_PSYCH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 espeak-ng
          ffmpeg -version
          ffprobe -version

      - name: Install lightweight AI test dependencies
        if: inputs.mode == 'provider-test'
        run: |
          python -m pip install --upgrade pip
          pip install "openai>=1.68.0" "google-genai>=0.7.0" "groq>=1.1.0" "python-dotenv>=1.2.0" "requests>=2.32.0"

      - name: Install full project dependencies
        if: inputs.mode != 'provider-test'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Prepare environment from existing GitHub Secrets
        env:
          MODE: ${{ inputs.mode }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from dotenv import set_key

          mode = os.environ["MODE"]
          channel = os.environ["CHANNEL"]

          # Build a fresh .env from Actions secrets only; never echo secret values.
          Path(".env").unlink(missing_ok=True)
          Path(".env").touch()
          env_names = [
              "NVIDIA_API_KEY", "NVIDIA_BASE_URL", "NVIDIA_MODEL",
              "GEMINI_API_KEY", *[f"GEMINI_API_KEY_{i}" for i in range(2, 11)],
              "GEMINI_API_KEYS", "GEMINI_MODEL", "GROQ_API_KEY", "ANTHROPIC_API_KEY",
              "OLLAMA_API_KEY", "OLLAMA_BASE_URL", "OLLAMA_MODEL",
              "PROVIDER_A_API_KEY", "PROVIDER_A_BASE_URL", "PROVIDER_A_MODEL",
              "YOUTUBE_API_KEY", "PEXELS_API_KEY", "PIXABAY_API_KEY", "PERPLEXITY_API_KEY",
              "ELEVENLABS_API_KEY", "FREESOUND_API_KEY", "ASSEMBLYAI_API_KEY",
              "COVERR_API_KEY", "COVERR_APP_ID", "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_API_TOKEN", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID",
              "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_DRIVE_FOLDER_ID",
          ]
          for name in env_names:
              value = os.environ.get(name, "").strip()
              if value:
                  set_key(".env", name, value, quote_mode="always")

          # NVIDIA defaults must survive empty optional secrets.
          set_key(".env", "NVIDIA_BASE_URL",
                  os.environ.get("NVIDIA_BASE_URL", "").strip() or "https://integrate.api.nvidia.com/v1",
                  quote_mode="always")
          set_key(".env", "NVIDIA_MODEL",
                  os.environ.get("NVIDIA_MODEL", "").strip() or "nvidia/nemotron-3.5-super-vl-120b-a12b",
                  quote_mode="always")

          # Ollama Cloud root URL is normalized to its OpenAI-compatible /v1 endpoint.
          ollama_key = os.environ.get("OLLAMA_API_KEY", "").strip()
          ollama_base = os.environ.get("OLLAMA_BASE_URL", "").strip().rstrip("/") or "https://ollama.com"
          ollama_model = os.environ.get("OLLAMA_MODEL", "").strip() or "deepseek-v3.1"
          computed_env = {
              "NVIDIA_BASE_URL": os.environ.get("NVIDIA_BASE_URL", "").strip() or "https://integrate.api.nvidia.com/v1",
              "NVIDIA_MODEL": os.environ.get("NVIDIA_MODEL", "").strip() or "nvidia/nemotron-3.5-super-vl-120b-a12b",
          }
          if ollama_key:
              ollama_api_base = ollama_base if ollama_base.endswith("/v1") else ollama_base + "/v1"
              set_key(".env", "OLLAMA_BASE_URL", ollama_base, quote_mode="always")
              set_key(".env", "OLLAMA_MODEL", ollama_model, quote_mode="always")
              provider_a_key = os.environ.get("PROVIDER_A_API_KEY", "").strip()
              provider_a_base = os.environ.get("PROVIDER_A_BASE_URL", "").strip()
              provider_a_model = os.environ.get("PROVIDER_A_MODEL", "").strip()
              if not (provider_a_key and provider_a_base and provider_a_model):
                  provider_a_key, provider_a_base, provider_a_model = ollama_key, ollama_api_base, ollama_model
              computed_env.update({
                  "OLLAMA_BASE_URL": ollama_base,
                  "OLLAMA_MODEL": ollama_model,
                  "PROVIDER_A_API_KEY": provider_a_key,
                  "PROVIDER_A_BASE_URL": provider_a_base,
                  "PROVIDER_A_MODEL": provider_a_model,
              })
          # Job-level empty values mask .env values, so export computed values to later steps.
          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as handle:
                  for name, value in computed_env.items():
                      if value:
                          handle.write("{}={}\n".format(name, value))
          for name, value in computed_env.items():
              if value:
                  set_key(".env", name, value, quote_mode="always")

          set_key(".env", "TTS_MODE", "edge", quote_mode="always")
          set_key(".env", "RENDER_PRESET", "fast", quote_mode="always")
          set_key(".env", "LOG_LEVEL", "INFO", quote_mode="always")

          # Fail early if no usable script provider is configured.
          gemini_keys = [
              os.environ.get("GEMINI_API_KEY", ""),
              *[os.environ.get(f"GEMINI_API_KEY_{i}", "") for i in range(2, 11)],
              *os.environ.get("GEMINI_API_KEYS", "").split(","),
          ]
          ai_ready = any([
              bool(os.environ.get("NVIDIA_API_KEY", "").strip()),
              any(k.strip() for k in gemini_keys),
              bool(os.environ.get("GROQ_API_KEY", "").strip()),
              bool(os.environ.get("ANTHROPIC_API_KEY", "").strip()),
              bool(ollama_key),
              bool(os.environ.get("PROVIDER_A_API_KEY", "").strip() and os.environ.get("PROVIDER_A_BASE_URL", "").strip()),
          ])
          if mode in ("script-test", "dry-run", "production") and not ai_ready:
              raise SystemExit("Tidak ada AI provider tersedia. Periksa NVIDIA_API_KEY, Gemini, Groq, Ollama, atau Provider-A/B.")

          token_map = {
              "ch_id_horror": ("TOKEN_CH_ID_HORROR", "config/credentials/ch_id_horror_v2.json"),
              "ch_id_psych": ("TOKEN_CH_ID_PSYCH", "config/credentials/ch_id_psych_v2.json"),
              "ch_en_horror": ("TOKEN_CH_EN_HORROR", "config/credentials/ch_en_horror_v2.json"),
              "ch_en_psych": ("TOKEN_CH_EN_PSYCH", "config/credentials/ch_en_psych_v2.json"),
          }
          if mode == "production":
              secret_name, token_path = token_map[channel]
              raw = os.environ.get(secret_name, "").strip()
              if not raw:
                  raise SystemExit(f"GitHub Secret {secret_name} belum tersedia.")
              try:
                  token = json.loads(raw)
              except json.JSONDecodeError:
                  token = json.loads(base64.b64decode(raw).decode("utf-8"))
              if not token.get("refresh_token"):
                  raise SystemExit("OAuth token tidak memiliki refresh_token; token perlu dibuat ulang dengan akses offline.")
              path = Path(token_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(token), encoding="utf-8")
              print(f"OAuth token siap untuk {channel}; refresh_token terdeteksi.")
          else:
              print(f"Mode {mode}: tidak memerlukan OAuth Google.")
          print("Environment disiapkan; nilai API key tidak ditampilkan.")
          PY

      - name: Validate configuration and Python syntax
        run: |
          test -f config/settings.json
          test -f config/campaigns.json
          python -m json.tool config/settings.json >/dev/null
          python -m json.tool config/campaigns.json >/dev/null
          python -m compileall -q main.py engine
          python - <<'PY'
          import json
          with open("config/settings.json", encoding="utf-8") as f:
              settings = json.load(f)
          ids = {c["id"] for c in settings.get("channels", [])}
          required = {"ch_id_horror", "ch_id_psych", "ch_en_horror", "ch_en_psych"}
          missing = required - ids
          if missing:
              raise SystemExit("Channel config missing: " + ", ".join(sorted(missing)))
          print("PASS: JSON configuration, Python syntax, and all four channel IDs.")
          PY

      - name: Test NVIDIA, Gemini key rotation, Ollama Cloud, and optional Groq
        if: inputs.mode == 'provider-test'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          results = []
          def record(name, ok, detail):
              results.append((name, ok, detail))
              print(("PASS" if ok else "FAIL") + ": " + name + " - " + detail)

          # NVIDIA NIM - same streaming API and model configuration as the user's successful test.
          key = os.getenv("NVIDIA_API_KEY", "").strip()
          if not key:
              record("NVIDIA", False, "NVIDIA_API_KEY belum tersedia")
          else:
              try:
                  from openai import OpenAI
                  client = OpenAI(
                      base_url=(os.getenv("NVIDIA_BASE_URL", "").strip() or "https://integrate.api.nvidia.com/v1"),
                      api_key=key, timeout=180.0, max_retries=1,
                  )
                  model = os.getenv("NVIDIA_MODEL", "").strip() or "nvidia/nemotron-3.5-super-vl-120b-a12b"
                  stream = client.chat.completions.create(
                      model=model,
                      messages=[{"role":"user","content":"Reply exactly NVIDIA_API_OK"}],
                      max_tokens=256, temperature=0.2, stream=True,
                  )
                  text = "".join(
                      getattr(chunk.choices[0].delta, "content", "") or ""
                      for chunk in stream if chunk.choices
                  ).strip()
                  if not text:
                      raise RuntimeError("respons streaming kosong")
                  record("NVIDIA", True, "autentikasi dan streaming berhasil; model " + model)
              except Exception as exc:
                  record("NVIDIA", False, type(exc).__name__ + ": " + str(exc)[:350])

          # Gemini - validate all configured key slots, then one real generation call.
          keys = []
          for name in ["GEMINI_API_KEY"] + [f"GEMINI_API_KEY_{i}" for i in range(2,11)]:
              value = os.getenv(name, "").strip()
              if value and value not in keys: keys.append(value)
          for value in os.getenv("GEMINI_API_KEYS", "").split(","):
              value = value.strip()
              if value and value not in keys: keys.append(value)
          if not keys:
              record("Gemini", False, "tidak ada GEMINI_API_KEY")
          else:
              try:
                  from google import genai
                  models = [os.getenv("GEMINI_MODEL", "").strip()] if os.getenv("GEMINI_MODEL", "").strip() else []
                  models += ["gemini-3.8-flash", "gemini-3.5-flash-lite"]
                  models = list(dict.fromkeys(m for m in models if m))
                  valid = []
                  for index, api_key in enumerate(keys, 1):
                      try:
                          client = genai.Client(api_key=api_key)
                          list(client.models.list())
                          valid.append((index, client))
                      except Exception as exc:
                          print(f"INFO: Gemini key slot {index} gagal validasi ({type(exc).__name__}); lanjut key berikutnya.")
                  if not valid:
                      raise RuntimeError("semua key Gemini gagal autentikasi/list models")
                  generated = False
                  last_error = None
                  for model in models:
                      for index, client in valid:
                          try:
                              response = client.models.generate_content(
                                  model=model,
                                  contents='Return exactly {"status":"ok"}',
                              )
                              if not getattr(response, "text", "").strip():
                                  raise RuntimeError("respons kosong")
                              record("Gemini", True, f"{len(keys)} key ditemukan, {len(valid)} lolos autentikasi; generation sukses dengan {model}")
                              generated = True
                              break
                          except Exception as exc:
                              last_error = exc
                      if generated: break
                  if not generated:
                      raise RuntimeError("generation gagal pada seluruh model/key: " + str(last_error)[:250])
              except Exception as exc:
                  record("Gemini", False, type(exc).__name__ + ": " + str(exc)[:350])

          # Ollama Cloud - configured as the additional OpenAI-compatible provider.
          ollama_key = os.getenv("OLLAMA_API_KEY", "").strip()
          if not ollama_key:
              record("Ollama Cloud", False, "OLLAMA_API_KEY belum tersedia")
          else:
              try:
                  base = (os.getenv("OLLAMA_BASE_URL", "").strip() or "https://ollama.com").rstrip("/")
                  model = os.getenv("OLLAMA_MODEL", "").strip() or "deepseek-v3.1"
                  payload = {"model":model,"messages":[{"role":"user","content":"Reply exactly OLLAMA_API_OK"}],"stream":False}
                  request = urllib.request.Request(
                      base + "/api/chat", data=json.dumps(payload).encode(),
                      headers={"Authorization":"Bearer "+ollama_key,"Content-Type":"application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=240) as response:
                      body = json.loads(response.read().decode())
                  answer = body.get("message",{}).get("content","").strip()
                  if not answer: raise RuntimeError("respons chat kosong")
                  record("Ollama Cloud", True, "chat endpoint berhasil; model " + model)
              except Exception as exc:
                  record("Ollama Cloud", False, type(exc).__name__ + ": " + str(exc)[:350])

          # Groq was previously observed as empty; treat it as optional, not as a false pass.
          groq_key = os.getenv("GROQ_API_KEY", "").strip()
          if not groq_key:
              print("SKIP: Groq - GROQ_API_KEY belum diisi (sebelumnya terdeteksi kosong)")
          else:
              try:
                  from groq import Groq
                  response = Groq(api_key=groq_key).chat.completions.create(
                      model="llama-3.3-70b-versatile",
                      messages=[{"role":"user","content":"Reply exactly GROQ_API_OK"}],
                      max_tokens=32,
                  )
                  if not response.choices[0].message.content:
                      raise RuntimeError("respons kosong")
                  record("Groq", True, "chat completion berhasil")
              except Exception as exc:
                  record("Groq", False, type(exc).__name__ + ": " + str(exc)[:350])

          failed_required = [name for name, ok, _ in results if not ok and name in ("NVIDIA","Gemini","Ollama Cloud")]
          if failed_required:
              print("Provider wajib gagal: " + ", ".join(failed_required))
              sys.exit(1)
          print("Provider test selesai. Tidak ada file video, Google Drive, atau YouTube yang disentuh.")
          PY

      - name: Preview campaign queue
        if: inputs.mode == 'preview'
        run: python -u main.py --preview

      - name: Test AI script generation only (no TTS/render/Drive/YouTube)
        if: inputs.mode == 'script-test'
        env:
          CHANNEL: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          PROFILE: ${{ inputs.profile }}
        run: |
          test -n "$TOPIC"
          python -u main.py --channel "$CHANNEL" --topic "$TOPIC" --profile "$PROFILE" --script-only

      - name: Dry-run production (no Google Drive upload)
        if: inputs.mode == 'dry-run'
        env:
          CHANNEL: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          PROFILE: ${{ inputs.profile }}
          SKIP_QC: ${{ inputs.skip_qc }}
        run: |
          test -n "$TOPIC"
          ARGS=(--channel "$CHANNEL" --topic "$TOPIC" --profile "$PROFILE" --dry-run)
          if [ "$SKIP_QC" = "true" ]; then ARGS+=(--skip-qc); fi
          python -u main.py "${ARGS[@]}"

      - name: Production pipeline (uploads rendered video to Google Drive queue)
        if: inputs.mode == 'production'
        env:
          CHANNEL: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          PROFILE: ${{ inputs.profile }}
          SKIP_QC: ${{ inputs.skip_qc }}
        run: |
          test -n "$TOPIC"
          ARGS=(--channel "$CHANNEL" --topic "$TOPIC" --profile "$PROFILE")
          if [ "$SKIP_QC" = "true" ]; then ARGS+=(--skip-qc); fi
          python -u main.py "${ARGS[@]}"

      - name: Upload logs, scripts, and generated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
