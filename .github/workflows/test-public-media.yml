name: Public Media Engine Tests

on:
  push:
    paths:
      - "engine/public_media_engine.py"
      - "engine/footage_engine.py"
      - "test_public_media_engine.py"
      - ".github/workflows/test-public-media.yml"
  pull_request:
    paths:
      - "engine/public_media_engine.py"
      - "engine/footage_engine.py"
      - "test_public_media_engine.py"
      - ".github/workflows/test-public-media.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependency
        run: python -m pip install requests
      - name: Compile changed engines
        run: python -m compileall -q engine/public_media_engine.py engine/footage_engine.py
      - name: Run public media unit tests
        run: python -m unittest -v test_public_media_engine
