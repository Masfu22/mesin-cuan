name: Mesin Cuan - GitHub Actions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pilih pengujian atau produksi"
        required: true
        type: choice
        options:
          - preview
          - script-test
          - dry-run
          - production
        default: preview
      channel:
        description: "Channel yang dijalankan"
        required: true
        type: choice
        options:
          - ch_id_horror
          - ch_id_psych
          - ch_en_horror
          - ch_en_psych
        default: ch_id_horror
      topic:
        description: "Topik manual (dipakai script-test, dry-run, dan production)"
        required: false
        type: string
        default: "Tes integrasi provider AI Mesin Cuan"
      profile:
        description: "Format konten"
        required: true
        type: choice
        options:
          - shorts
          - long_form
        default: shorts
      skip_qc:
        description: "Lewati QC Vision (tidak disarankan)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mesin-cuan-${{ inputs.mode == 'production' && 'production' || inputs.mode == 'dry-run' && 'dry-run' || 'test' }}
  cancel-in-progress: false

jobs:
  run:
    name: Mesin Cuan / ${{ inputs.mode }} / ${{ inputs.channel }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TTS_MODE: edge
      RENDER_PRESET: fast
      LOG_LEVEL: INFO
      # NVIDIA: utama untuk pembuatan naskah dan analisis vision.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
      NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
      # Gemini: fallback berotasi (satu sampai sepuluh key).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
      GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
      GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
      GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      # Provider tambahan.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
      OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
      PROVIDER_A_API_KEY: ${{ secrets.PROVIDER_A_API_KEY }}
      PROVIDER_A_BASE_URL: ${{ secrets.PROVIDER_A_BASE_URL }}
      PROVIDER_A_MODEL: ${{ secrets.PROVIDER_A_MODEL }}
      PROVIDER_B_API_KEY: ${{ secrets.PROVIDER_B_API_KEY }}
      PROVIDER_B_BASE_URL: ${{ secrets.PROVIDER_B_BASE_URL }}
      PROVIDER_B_MODEL: ${{ secrets.PROVIDER_B_MODEL }}
      # Media, research, voice, and notifications.
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVERR_APP_ID: ${{ secrets.COVERR_APP_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      TOKEN_CH_ID_HORROR: ${{ secrets.TOKEN_CH_ID_HORROR }}
      TOKEN_CH_ID_PSYCH: ${{ secrets.TOKEN_CH_ID_PSYCH }}
      TOKEN_CH_EN_HORROR: ${{ secrets.TOKEN_CH_EN_HORROR }}
      TOKEN_CH_EN_PSYCH: ${{ secrets.TOKEN_CH_EN_PSYCH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 espeak-ng
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Prepare environment from existing GitHub Secrets
        env:
          MODE: ${{ inputs.mode }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from dotenv import set_key

          mode = os.environ["MODE"]
          channel = os.environ["CHANNEL"]

          # Build a fresh .env from Actions secrets only; never echo secret values.
          Path(".env").unlink(missing_ok=True)
          Path(".env").touch()
          env_names = [
              "NVIDIA_API_KEY", "NVIDIA_BASE_URL", "NVIDIA_MODEL",
              "GEMINI_API_KEY", *[f"GEMINI_API_KEY_{i}" for i in range(2, 11)],
              "GEMINI_API_KEYS", "GEMINI_MODEL", "GROQ_API_KEY", "ANTHROPIC_API_KEY",
              "OLLAMA_API_KEY", "OLLAMA_BASE_URL", "OLLAMA_MODEL",
              "PROVIDER_A_API_KEY", "PROVIDER_A_BASE_URL", "PROVIDER_A_MODEL",
              "PROVIDER_B_API_KEY", "PROVIDER_B_BASE_URL", "PROVIDER_B_MODEL",
              "YOUTUBE_API_KEY", "PEXELS_API_KEY", "PIXABAY_API_KEY", "PERPLEXITY_API_KEY",
              "ELEVENLABS_API_KEY", "FREESOUND_API_KEY", "ASSEMBLYAI_API_KEY",
              "COVERR_API_KEY", "COVERR_APP_ID", "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_API_TOKEN", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID",
              "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GOOGLE_DRIVE_FOLDER_ID",
          ]
          for name in env_names:
              value = os.environ.get(name, "").strip()
              if value:
                  set_key(".env", name, value, quote_mode="always")

          # NVIDIA defaults must survive empty optional secrets.
          set_key(".env", "NVIDIA_BASE_URL",
                  os.environ.get("NVIDIA_BASE_URL", "").strip() or "https://integrate.api.nvidia.com/v1",
                  quote_mode="always")
          set_key(".env", "NVIDIA_MODEL",
                  os.environ.get("NVIDIA_MODEL", "").strip() or "nvidia/nemotron-3.5-super-vl-120b-a12b",
                  quote_mode="always")

          # Ollama Cloud is an additional provider after NVIDIA/Gemini/Groq.
          # Its OpenAI-compatible endpoint requires /v1 for Provider-A.
          ollama_key = os.environ.get("OLLAMA_API_KEY", "").strip()
          ollama_base = os.environ.get("OLLAMA_BASE_URL", "").strip().rstrip("/") or "https://ollama.com"
          ollama_model = os.environ.get("OLLAMA_MODEL", "").strip() or "deepseek-v3.1:671b-cloud"
          if ollama_key:
              set_key(".env", "OLLAMA_BASE_URL", ollama_base, quote_mode="always")
              set_key(".env", "OLLAMA_MODEL", ollama_model, quote_mode="always")
              if not os.environ.get("PROVIDER_A_API_KEY", "").strip():
                  set_key(".env", "PROVIDER_A_API_KEY", ollama_key, quote_mode="always")
              if not os.environ.get("PROVIDER_A_BASE_URL", "").strip():
                  set_key(".env", "PROVIDER_A_BASE_URL", ollama_base + "/v1", quote_mode="always")
              if not os.environ.get("PROVIDER_A_MODEL", "").strip():
                  set_key(".env", "PROVIDER_A_MODEL", ollama_model, quote_mode="always")

          set_key(".env", "TTS_MODE", "edge", quote_mode="always")
          set_key(".env", "RENDER_PRESET", "fast", quote_mode="always")
          set_key(".env", "LOG_LEVEL", "INFO", quote_mode="always")

          # Fail early if no usable script provider is configured.
          gemini_keys = [
              os.environ.get("GEMINI_API_KEY", ""),
              *[os.environ.get(f"GEMINI_API_KEY_{i}", "") for i in range(2, 11)],
              *os.environ.get("GEMINI_API_KEYS", "").split(","),
          ]
          ai_ready = any([
              bool(os.environ.get("NVIDIA_API_KEY", "").strip()),
              any(k.strip() for k in gemini_keys),
              bool(os.environ.get("GROQ_API_KEY", "").strip()),
              bool(os.environ.get("ANTHROPIC_API_KEY", "").strip()),
              bool(ollama_key),
              bool(os.environ.get("PROVIDER_A_API_KEY", "").strip() and os.environ.get("PROVIDER_A_BASE_URL", "").strip()),
              bool(os.environ.get("PROVIDER_B_API_KEY", "").strip() and os.environ.get("PROVIDER_B_BASE_URL", "").strip()),
          ])
          if mode in ("script-test", "dry-run", "production") and not ai_ready:
              raise SystemExit("Tidak ada AI provider tersedia. Periksa NVIDIA_API_KEY, Gemini, Groq, Ollama, atau Provider-A/B.")

          token_map = {
              "ch_id_horror": ("TOKEN_CH_ID_HORROR", "config/credentials/ch_id_horror_v2.json"),
              "ch_id_psych": ("TOKEN_CH_ID_PSYCH", "config/credentials/ch_id_psych_v2.json"),
              "ch_en_horror": ("TOKEN_CH_EN_HORROR", "config/credentials/ch_en_horror_v2.json"),
              "ch_en_psych": ("TOKEN_CH_EN_PSYCH", "config/credentials/ch_en_psych_v2.json"),
          }
          if mode == "production":
              secret_name, token_path = token_map[channel]
              raw = os.environ.get(secret_name, "").strip()
              if not raw:
                  raise SystemExit(f"GitHub Secret {secret_name} belum tersedia.")
              try:
                  token = json.loads(raw)
              except json.JSONDecodeError:
                  token = json.loads(base64.b64decode(raw).decode("utf-8"))
              if not token.get("refresh_token"):
                  raise SystemExit("OAuth token tidak memiliki refresh_token; token perlu dibuat ulang dengan akses offline.")
              path = Path(token_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(token), encoding="utf-8")
              print(f"OAuth token siap untuk {channel}; refresh_token terdeteksi.")
          else:
              print(f"Mode {mode}: tidak memerlukan OAuth Google.")
          print("Environment disiapkan; nilai API key tidak ditampilkan.")
          PY

      - name: Validate configuration and Python syntax
        run: |
          test -f config/settings.json
          test -f config/campaigns.json
          python -m json.tool config/settings.json >/dev/null
          python -m json.tool config/campaigns.json >/dev/null
          python -m compileall -q main.py engine
          python - <<'PY'
          import json
          with open("config/settings.json", encoding="utf-8") as f:
              settings = json.load(f)
          ids = {c["id"] for c in settings.get("channels", [])}
          required = {"ch_id_horror", "ch_id_psych", "ch_en_horror", "ch_en_psych"}
          missing = required - ids
          if missing:
              raise SystemExit("Channel config missing: " + ", ".join(sorted(missing)))
          print("PASS: JSON configuration, Python syntax, and all four channel IDs.")
          PY

      - name: Preview campaign queue
        if: inputs.mode == 'preview'
        run: python -u main.py --preview

      - name: Test AI script generation only (no TTS/render/Drive/YouTube)
        if: inputs.mode == 'script-test'
        env:
          CHANNEL: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          PROFILE: ${{ inputs.profile }}
        run: |
          test -n "$TOPIC"
          python -u main.py --channel "$CHANNEL" --topic "$TOPIC" --profile "$PROFILE" --script-only

      - name: Dry-run production (no Google Drive upload)
        if: inputs.mode == 'dry-run'
        env:
          CHANNEL: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          PROFILE: ${{ inputs.profile }}
          SKIP_QC: ${{ inputs.skip_qc }}
        run: |
          test -n "$TOPIC"
          ARGS=(--channel "$CHANNEL" --topic "$TOPIC" --profile "$PROFILE" --dry-run)
          if [ "$SKIP_QC" = "true" ]; then ARGS+=(--skip-qc); fi
          python -u main.py "${ARGS[@]}"

      - name: Production pipeline (uploads rendered video to Google Drive queue)
        if: inputs.mode == 'production'
        env:
          CHANNEL: ${{ inputs.channel }}
          TOPIC: ${{ inputs.topic }}
          PROFILE: ${{ inputs.profile }}
          SKIP_QC: ${{ inputs.skip_qc }}
        run: |
          test -n "$TOPIC"
          ARGS=(--channel "$CHANNEL" --topic "$TOPIC" --profile "$PROFILE")
          if [ "$SKIP_QC" = "true" ]; then ARGS+=(--skip-qc); fi
          python -u main.py "${ARGS[@]}"

      - name: Upload logs, scripts, and generated output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesin-cuan-${{ inputs.mode }}-${{ inputs.channel }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            logs/
            data/${{ inputs.channel }}/scripts/
            output/
