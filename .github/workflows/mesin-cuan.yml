name: Mesin Cuan - GitHub Actions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode eksekusi"
        required: true
        type: choice
        options: [preview, dry-run, production]
        default: preview
      channel:
        description: "ID channel (kosongkan untuk semua channel aktif)"
        required: false
        type: string
        default: ""
      debug:
        description: "Aktifkan log debug"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mesin-cuan-production
  cancel-in-progress: false

jobs:
  run:
    name: Jalankan Mesin Cuan (${{ inputs.mode }})
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PROVIDER_A_API_KEY: ${{ secrets.PROVIDER_A_API_KEY }}
      PROVIDER_A_BASE_URL: ${{ vars.PROVIDER_A_BASE_URL }}
      PROVIDER_A_MODEL: ${{ vars.PROVIDER_A_MODEL }}
      PROVIDER_B_API_KEY: ${{ secrets.PROVIDER_B_API_KEY }}
      PROVIDER_B_BASE_URL: ${{ vars.PROVIDER_B_BASE_URL }}
      PROVIDER_B_MODEL: ${{ vars.PROVIDER_B_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      COVERR_APP_ID: ${{ secrets.COVERR_APP_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      TTS_MODE: edge
      RENDER_PRESET: fast
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Restore per-channel Google OAuth tokens
        if: inputs.mode == 'production'
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          TOKEN_CH_ID_HORROR: ${{ secrets.TOKEN_CH_ID_HORROR }}
          TOKEN_CH_ID_PSYCH: ${{ secrets.TOKEN_CH_ID_PSYCH }}
          TOKEN_CH_EN_HORROR: ${{ secrets.TOKEN_CH_EN_HORROR }}
          TOKEN_CH_EN_PSYCH: ${{ secrets.TOKEN_CH_EN_PSYCH }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, sys
          mapping = {
              "TOKEN_CH_ID_HORROR": "config/credentials/ch_id_horror_v2.json",
              "TOKEN_CH_ID_PSYCH": "config/credentials/ch_id_psych_v2.json",
              "TOKEN_CH_EN_HORROR": "config/credentials/ch_en_horror_v2.json",
              "TOKEN_CH_EN_PSYCH": "config/credentials/ch_en_psych_v2.json",
          }
          selected = os.environ.get("INPUT_CHANNEL", "").strip()
          required = {
              "ch_id_horror": ["TOKEN_CH_ID_HORROR"],
              "ch_horror_id": ["TOKEN_CH_ID_HORROR"],
              "ch_id_psych": ["TOKEN_CH_ID_PSYCH"],
              "ch_en_horror": ["TOKEN_CH_EN_HORROR"],
              "ch_en_psych": ["TOKEN_CH_EN_PSYCH"],
          }
          names = required.get(selected, list(mapping))
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              print("OAuth secret belum diatur: " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          for name in names:
              raw = os.environ[name].strip()
              try:
                  json.loads(raw)
                  payload = raw
              except Exception:
                  payload = base64.b64decode(raw).decode("utf-8")
                  json.loads(payload)
              path = pathlib.Path(mapping[name])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(payload, encoding="utf-8")
              print(f"OAuth token siap: {path}")
          PY

      - name: Validate configuration files and Python syntax
        run: |
          test -f config/settings.json
          test -f config/campaigns.json
          python -m json.tool config/settings.json >/dev/null
          python -m json.tool config/campaigns.json >/dev/null
          python -m compileall -q main.py engine

      - name: Run preview
        if: inputs.mode == 'preview'
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -n "$INPUT_CHANNEL" ]; then
            python main.py --channel "$INPUT_CHANNEL" --preview
          else
            python main.py --preview
          fi

      - name: Run dry-run (without Google Drive upload)
        if: inputs.mode == 'dry-run'
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DEBUG: ${{ inputs.debug }}
        run: |
          ARGS=(--dry-run)
          if [ -n "$INPUT_CHANNEL" ]; then ARGS+=(--channel "$INPUT_CHANNEL"); fi
          if [ "$INPUT_DEBUG" = "true" ]; then ARGS+=(--debug); fi
          python main.py "${ARGS[@]}"

      - name: Run production pipeline
        if: inputs.mode == 'production'
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DEBUG: ${{ inputs.debug }}
        run: |
          ARGS=()
          if [ -n "$INPUT_CHANNEL" ]; then ARGS+=(--channel "$INPUT_CHANNEL"); fi
          if [ "$INPUT_DEBUG" = "true" ]; then ARGS+=(--debug); fi
          python main.py "${ARGS[@]}"

      - name: Upload logs and generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesin-cuan-${{ inputs.mode }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            logs/
            output/
            data/
