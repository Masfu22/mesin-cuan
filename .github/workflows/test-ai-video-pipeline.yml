name: Test AI Video Pipeline and Fallbacks

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ai-video-pipeline.yml"
      - "engine/ai_engine.py"
      - "engine/topic_engine.py"
      - "engine/script_engine.py"
      - "engine/qc_vision_engine.py"
      - "engine/gdrive_engine.py"
      - "engine/utils.py"
      - "main.py"
      - "tests/test_ai_provider_fallback.py"
      - "tests/test_gemini_qc_safety.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  fallback-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check requests python-dotenv openai google-genai
      - name: Test provider waterfall, Gemini key rotation, and QC safety
        run: |
          python -m unittest discover -s tests -p "test_ai_provider_fallback.py" -v
          python -m unittest discover -s tests -p "test_gemini_qc_safety.py" -v
          python -m compileall -q main.py engine tests

  nvidia-video-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install video AI dependencies
        run: python -m pip install --disable-pip-version-check requests python-dotenv openai google-genai
      - name: Run synthetic video through complete NVIDIA analysis pipeline
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: nvidia/nemotron-3.5-super-vl-120b-a12b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "FAIL: NVIDIA_API_KEY secret is missing."
            exit 1
          fi
          mkdir -p test-output
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=24:duration=15" \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart test-output/synthetic-video.mp4
          python - <<'PY'
          import json
          import os
          from engine import ai_engine

          video = "test-output/synthetic-video.mp4"
          duration = ai_engine._get_video_duration(video)
          if duration < 14:
              raise SystemExit(f"FAIL: generated video duration invalid: {duration}")

          clips = ai_engine.analyze(
              [video],
              "cinematic",
              {"min_clips_per_video": 1, "max_total_clips": 2},
          )
          if not clips:
              raise SystemExit("FAIL: full video analysis returned no valid clips.")
          for clip in clips:
              if clip["start_sec"] < 0 or clip["end_sec"] > duration or clip["end_sec"] <= clip["start_sec"]:
                  raise SystemExit("FAIL: returned clip timestamps are outside the source video.")
          print("PASS: FFmpeg → frame extraction → NVIDIA/Gemini/Ollama provider waterfall → JSON parser.")
          print("Video duration:", round(duration, 2), "seconds")
          print("Valid clips:", len(clips))
          print("Clip metadata:", json.dumps(
              [{"start": c["start"], "end": c["end"], "score": c["score"]} for c in clips],
              ensure_ascii=False,
          ))
          PY

  gemini-live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check google-genai Pillow
      - name: Test Gemini text and image understanding when key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python - <<'PY'
          import os
          import sys

          keys = [
              os.environ.get("GEMINI_API_KEY", "").strip(),
              *[os.environ.get(f"GEMINI_API_KEY_{i}", "").strip() for i in range(2, 11)],
              *[value.strip() for value in os.environ.get("GEMINI_API_KEYS", "").split(",")],
          ]
          keys = list(dict.fromkeys(key for key in keys if key))
          if not keys:
              print("SKIP: no Gemini API key secrets configured; provider fallback is covered by unit tests.")
              sys.exit(0)

          from google import genai
          from google.genai import types

          models = list(dict.fromkeys([
              os.environ.get("GEMINI_MODEL", "gemini-3.8-flash").strip(),
              "gemini-3.5-flash-lite",
          ]))
          errors = []
          for model in models:
              for index, key in enumerate(keys, start=1):
                  try:
                      client = genai.Client(
                          api_key=key,
                          http_options=types.HttpOptions(timeout=20000),
                      )
                      response = client.models.generate_content(
                          model=model,
                          contents="Reply with exactly: GEMINI API CHECK PASSED",
                          config=types.GenerateContentConfig(temperature=0),
                      )
                      answer = (getattr(response, "text", None) or "").strip().upper()
                      if "GEMINI API CHECK PASSED" in " ".join(answer.split()):
                          print("Gemini key slot", index, "passed.")
                          print("PASS: Gemini generate_content authentication and text generation succeeded.")
                          print("Model:", model)
                          print("Response content withheld from logs.")
                          sys.exit(0)
                      errors.append(f"{model}/key slot {index}: empty or unexpected output")
                  except Exception as exc:
                      status = getattr(exc, "status_code", getattr(exc, "code", "unknown"))
                      errors.append(f"{model}/key slot {index}: {type(exc).__name__} status={status}")
          raise SystemExit("FAIL: no Gemini model/key combination passed: " + "; ".join(errors))
          PY
