name: Validate original AI provider waterfall

on:
  push:
    branches:
      - fix/restore-original-ai-waterfall
  pull_request:
    branches:
      - main
    paths:
      - "engine/script_engine.py"
      - "engine/research_engine.py"
      - ".github/workflows/run-mesin-cuan.yml"
      - ".env.example"
      - ".github/workflows/validate-ai-waterfall.yml"
      - ".github/workflows/test-nvidia-free.yml"
      - ".github/workflows/test-script-generation-only.yml"

permissions:
  contents: read

jobs:
  syntax-and-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: |
          python -m compileall -q engine main.py

      - name: Verify original provider order and safe generation path
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("engine/script_engine.py").read_text(encoding="utf-8")
          start = source.index("def _call_ai(")
          end = source.index("# ─── Dual Parallel Generation", start)
          ai = source[start:end]

          labels = ['"DeepSeek/Ollama"', '"Groq"', '"Gemini"', '"Anthropic"', '"NVIDIA NIM (evaluation)"']
          positions = [ai.index(label) for label in labels]
          assert positions == sorted(positions), "AI provider order is not the original waterfall"
          assert 'NVIDIA_ENABLE_FREE_FALLBACK' in ai, "NVIDIA free API must be explicitly gated"
          assert 'NVIDIA_API_KEY' in ai, "NVIDIA evaluation fallback must require a key"

          generate_start = source.index("def generate(")
          generate_end = source.index("def review_hook_only(", generate_start)
          generate = source[generate_start:generate_end]
          assert "result = _call_ai(" in generate, "generate() must use sequential waterfall"
          assert "_generate_and_pick_best(" not in generate, "parallel generator must not override original order"

          workflow = Path(".github/workflows/run-mesin-cuan.yml").read_text(encoding="utf-8")
          for key in ("OLLAMA_BASE_URL", "OLLAMA_API_KEY", "OLLAMA_MODEL",
                      "GEMINI_API_KEY", "GROQ_API_KEY", "ANTHROPIC_API_KEY",
                      "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET",
                      "TOKEN_CH_ID_HORROR", "TOKEN_CH_ID_PSYCH",
                      "TOKEN_CH_EN_HORROR", "TOKEN_CH_EN_PSYCH"):
              assert key in workflow, f"Missing workflow environment key: {key}"

          assert "NVIDIA_ENABLE_FREE_FALLBACK" not in workflow, "Free NVIDIA evaluation fallback must not be enabled in production workflow"
          nvidia_test = Path(".github/workflows/test-nvidia-free.yml").read_text(encoding="utf-8")
          assert "workflow_dispatch:" in nvidia_test, "NVIDIA connection test must be manual only"
          assert "NVIDIA_API_KEY" in nvidia_test and "chat/completions" in nvidia_test
          research = Path("engine/research_engine.py").read_text(encoding="utf-8")
          assert 'OLLAMA_BASE_URL = os.environ.get("OLLAMA_BASE_URL", "")' in research
          assert "/api/chat" in research
          assert 'OLLAMA_MODEL = os.environ.get("OLLAMA_MODEL"' in research
          assert "http://localhost:11434" not in research, "Cloud workflow must not silently call localhost"

          assert "default: true" in workflow, "Production workflow must default to dry-run"
          script_test = Path(".github/workflows/test-script-generation-only.yml").read_text(encoding="utf-8")
          assert "--script-only" in script_test, "Script-only test must not run the render/upload pipeline"
          assert "upload-artifact@v4" in script_test, "Script-only output should be retained as an artifact"

          print("PASS: Python syntax, provider order, Ollama Cloud endpoint, dry-run safety, script-only test, and preserved integration variables.")
          PY
