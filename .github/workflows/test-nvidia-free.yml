name: Test NVIDIA free NIM API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-nvidia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test NVIDIA hosted API without revealing secrets
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          key = os.getenv("NVIDIA_API_KEY", "").strip()
          if not key:
              raise SystemExit("FAIL: NVIDIA_API_KEY belum diisi di GitHub Secrets.")

          base = os.getenv("NVIDIA_BASE_URL", "https://integrate.api.nvidia.com/v1").strip().rstrip("/")
          model = os.getenv("NVIDIA_MODEL", "").strip() or "nvidia/nemotron-3-super-120b-a12b"
          if not base.startswith("https://integrate.api.nvidia.com"):
              raise SystemExit("FAIL: NVIDIA_BASE_URL harus memakai endpoint resmi integrate.api.nvidia.com.")

          payload = {
              "model": model,
              "messages": [
                  {"role": "system", "content": "Return only a JSON object. No markdown."},
                  {"role": "user", "content": "Return exactly this JSON: {\"status\":\"ok\",\"provider\":\"nvidia\"}"},
              ],
              "temperature": 0,
              "max_tokens": 128,
              "stream": False,
              "response_format": {"type": "json_object"},
          }
          request = urllib.request.Request(
              base + "/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )

          response_data = None
          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      response_data = json.loads(response.read().decode("utf-8"))
                  break
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:350]
                  if exc.code == 429 and attempt < 3:
                      retry_after = exc.headers.get("Retry-After", "")
                      try:
                          wait = min(90, max(10, int(float(retry_after)))) if retry_after else 30 * attempt
                      except ValueError:
                          wait = 30 * attempt
                      print(f"NVIDIA free tier rate-limited (429); retry in {wait}s.")
                      time.sleep(wait)
                      continue
                  if exc.code == 410:
                      raise SystemExit("FAIL: HTTP 410. Model/endpoint is no longer available; choose a currently active model in build.nvidia.com and set NVIDIA_MODEL.")
                  raise SystemExit(f"FAIL: NVIDIA HTTP {exc.code}: {detail}")
              except Exception as exc:
                  raise SystemExit(f"FAIL: connection error: {type(exc).__name__}: {exc}")

          if response_data is None:
              raise SystemExit("FAIL: no response from NVIDIA.")
          content = response_data.get("choices", [{}])[0].get("message", {}).get("content", "").strip()
          try:
              parsed = json.loads(content)
          except Exception as exc:
              raise SystemExit(f"FAIL: model response is not valid JSON: {exc}")
          if parsed.get("status") != "ok" or parsed.get("provider") != "nvidia":
              raise SystemExit("FAIL: response JSON did not match the expected result.")

          print("PASS: NVIDIA API key authenticated.")
          print(f"PASS: model {model} returned valid JSON.")
          print("PASS: This test only called NVIDIA; it did not generate, render, store, or upload a video.")
          PY
